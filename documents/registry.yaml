# GCAII registry
#
# Append-only. Nothing in this file is deleted; an entry that expires or is
# revoked is marked, not removed.
#
# Two lists live here and they are not the same thing:
#   releases     — published versions of a document. Issued by the Secretariat.
#   declarations — conformance claims filed by adopters. Recorded, not approved.
#
# The Secretariat cannot alter a declaration without invalidating its
# report_sha256. That is the point of the hash: it is a constraint on the
# record-keeper, not on the adopter.

