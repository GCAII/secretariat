name: Bug report
description: Report a defect in a GCAII document, schema, or harness.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** use this form for security vulnerabilities.
        See `SECURITY.md` instead.

  - type: input
    id: location
    attributes:
      label: Location
      description: File path, section, or URL.
      placeholder: specs/GCAII-STD-0001/spec.md (Section 5.2)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, commands, versions, hardware.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
